# web/ を Cloudflare Pages(プロジェクト名: yonmoku)へ自動デプロイする。
#   - main への push で web/ 配下が変わったときだけ走る
#   - デプロイ前に WASM エンジンのテストを通す(古い/壊れた yonmoku.wasm を公開しないため)
#   - 手動実行も可(Actions タブの "Run workflow")
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 公開する yonmoku.wasm / yonmoku.js がそのまま動くことを確認する。
      - name: Test WASM engine
        run: node web/test_node.mjs

      - name: Test worker protocol
        run: node web/test_worker.mjs

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: pages deploy web --project-name=yonmoku --branch=main
